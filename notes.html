<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes - StudentHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-header">

        <div class="logo">
            <h1>StudentHub</h1>
            <p>Student Productivity & Academic Management System</p>
        </div>

        <div class="user-area">
            <span>🔔</span>
            <span>👤 Student</span>
        </div>

    </header>

    <div class="app-layout">

        <nav class="sidebar">

            <ul>
                <li>
                    <a href="index.html" class="nav-link">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="tasks.html" class="nav-link">
                        Tasks
                    </a>
                </li>

                <li>
                    <a href="courses.html" class="nav-link">
                        Courses
                    </a>
                </li>

                <li>
                    <a href="attendance.html" class="nav-link">
                        Attendance
                    </a>
                </li>

                <li>
                    <a href="notes.html" class="nav-link active">
                        Notes
                    </a>
                </li>

                <li>
                    <a href="#" class="nav-link">
                        Analytics
                    </a>
                </li>

                <li>
                    <a href="#" class="nav-link">
                        Calendar
                    </a>
                </li>

            </ul>

        </nav>

        <main class="dashboard">
            <section class="notes-page">
                <div class="section-header notes-page-header">
                    <div>
                        <h2>Notes</h2>
                        <p>
                            Keep your subject and personal notes organized in one place.
                        </p>
                    </div>
                    <button id="add-note-button">
                        + Add Note
                    </button>
                </div>
                <div class="notes-tabs">

                    <button
                        class="notes-tab active"
                        id="subject-notes-tab">
                        Subject Notes
                    </button>

                    <button
                        class="notes-tab"
                        id="personal-notes-tab">
                        Personal Notes
                    </button>
                </div>

                <div class="notes-toolbar">
                    <input
                        type="text"
                        id="notes-search"
                        placeholder="Search notes...">
                </div>

                <div id="notes-container"></div>
            </section>
        </main>
    </div>

    <!-- Add / Edit Note Modal -->

    <div id="note-modal" class="note-modal">
        <div class="note-modal-content">
            <div class="modal-header">
                <h2 id="note-modal-title">
                    Add Note
                </h2>

                <button
                    type="button"
                    id="close-note-modal">
                    &times;
                </button>
            </div>

            <form id="note-form">

                <label for="note-type-input">
                    Note Type
                </label>

                <select id="note-type-input" required>

                    <option value="subject">
                        Subject Note
                    </option>

                    <option value="personal">
                        Personal Note
                    </option>

                </select>

                <div id="note-course-group">
                    <label for="note-course-input">
                        Course
                    </label>
                    <select id="note-course-input">
                        <option value="">
                            Select course
                        </option>
                    </select>
                </div>

                <label for="note-title-input">
                    Title
                </label>

                <input
                    type="text"
                    id="note-title-input"
                    placeholder="Enter note title"
                    required>

                <label for="note-content-input">
                    Note
                </label>

                <textarea
                    id="note-content-input"
                    rows="8"
                    placeholder="Write your note here..."
                    required>
                </textarea>
                
                <div class="modal-actions">
                    <button
                        type="button"
                        id="cancel-note-button">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="save-note-button">
                        Save Note
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Courses must load before notes.js -->

    <script src="js/courses.js"></script>
    <script src="js/notes.js"></script>

</body>
</html>
